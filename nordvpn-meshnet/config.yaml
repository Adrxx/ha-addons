---
name: NordVPN Meshnet
version: "1.0.4"
slug: nordvpn_meshnet
description: >-
  Joins this Home Assistant to your NordVPN Meshnet so you can reach it from a
  remote network without exposing it to the internet. Meshnet only: it never
  routes Home Assistant's own traffic through a VPN server.
url: https://github.com/Adrxx/ha-addons/tree/main/nordvpn-meshnet
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto

# Meshnet must live in the host network namespace. Otherwise the meshnet
# interface would exist only inside this container and peers would reach the
# add-on rather than Home Assistant on :8123.
host_network: true

# NET_ADMIN creates the tunnel interface and adds routes; /dev/net/tun is the
# userspace WireGuard device.
#
# SYS_ADMIN is needed for exactly one thing: enabling Meshnet fails with
#   setting mesh: setting routing rules: setting rp filter:
#   sysctl: permission denied on key "net.ipv4.conf.all.rp_filter"
# because /proc/sys is mounted read-only in add-on containers. SYS_ADMIN lets
# run.sh remount it read-write so the client can set rp_filter=2, which it
# requires. See DOCS.md -- this does change a host-wide network setting.
#
# We still do NOT need SYS_MODULE or full_access: nordvpn 5.x ships
# libtelio.so and loads no kernel module (verified against the 5.2.0 deb).
privileged:
  - NET_ADMIN
  - SYS_ADMIN
devices:
  - /dev/net/tun

# Home Assistant's default AppArmor profile denies mount(2), so even with
# SYS_ADMIN the remount of /proc/sys is refused and Meshnet cannot set
# rp_filter. Disabling the profile is the only way to permit that mount from
# an add-on. Everything else the add-on is allowed to do is still bounded by
# the two capabilities above -- there is no full_access here.
apparmor: false

options:
  token: ""
  nickname: homeassistant
  allow_incoming: true
  allow_lan_access: false
  allow_fileshare: false
  nordvpn_firewall: false
  check_interval: 300
  log_level: info

schema:
  token: password
  nickname: str?
  allow_incoming: bool
  allow_lan_access: bool
  allow_fileshare: bool
  nordvpn_firewall: bool
  check_interval: int(60,3600)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
